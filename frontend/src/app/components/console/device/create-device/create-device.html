<div class="dialog">
  <h2 class="centered">Add device</h2>
  <form class="form" [formGroup]="deviceCreateForm" (ngSubmit)="submit()">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" type="text" formControlName="name" />
      @if (deviceCreateForm.controls.name.invalid && deviceCreateForm.controls.name.touched) {
        <small class="error-message">Name is required and must be max 100 characters.</small>
      }
    </div>
    <div class="form-group">
      <label for="ipAddress">Address IP</label>
      <input id="ipAddress" type="text" formControlName="ipAddress" />
    </div>
    <div class="form-group">
      <label for="type">Type</label>
      <input id="type" type="text" formControlName="type" />
    </div>
    <div class="form-actions">
      <button type="reset">Clear</button>
      <button type="submit">Create</button>
    </div>
    @if (errorMessage()) {
      <p class="error-message centered">{{ errorMessage() }}</p>
    }
  </form>
</div>
