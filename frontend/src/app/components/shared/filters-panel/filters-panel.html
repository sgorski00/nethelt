<div class="filters-box">
  <button
    type="button"
    class="filters-toggle"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="bodyId"
    (click)="toggle()"
  >
    <i class="fa-solid fa-sliders" aria-hidden="true"></i>
    <span>{{ title() }}</span>
    @if (active()) {
      <span class="filters-active">Active</span>
    }
    <i
      class="fa-solid fa-chevron-down filters-chevron"
      [class.open]="open()"
      aria-hidden="true"
    ></i>
  </button>
  <div class="filters-body" [id]="bodyId" [hidden]="!open()">
    <ng-content />
  </div>
</div>
