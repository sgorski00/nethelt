name: Desktop client release

# Tag client-v<MAJOR.MINOR.PATCH> publishes a GitHub release.
on:
  push:
    tags:
      - 'client-v*'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop-client/**'
      - '.github/workflows/desktop-client-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a test build (numeric MAJOR.MINOR.PATCH, MAJOR >= 1)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: desktop-client-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NETHELT_API_URL: ${{ vars.NETHELT_API_URL }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#client-v}"
          else
            # Pull requests have no input
            version="${INPUT_VERSION:-1.0.0}"
          fi
          # jpackage accepts only numeric versions on Windows and a non-zero major version on macOS
          if ! [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH with MAJOR >= 1, got '$version'"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ -z "$NETHELT_API_URL" ]; then
            echo "::error::Repository variable NETHELT_API_URL is required for releases"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # jpackage and Inno Setup cannot cross-compile, every platform is built on its own runner
  build:
    needs: prepare
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # dist: files to publish. Windows gets only the installer, it embeds the app image itself
          # and install.sh does not support Windows, so the core zip would be unused
          - platform: linux-x64
            runner: ubuntu-22.04
            dist: nethelt-core-*.tar.gz
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            dist: nethelt-core-*.tar.gz
          - platform: macos-arm64
            runner: macos-15
            dist: nethelt-core-*.tar.gz
          - platform: windows-x64
            runner: windows-2025
            dist: nethelt-setup-*.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Ensure Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build distribution
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NETHELT_API_URL: ${{ vars.NETHELT_API_URL }}
        run: |
          args=(-B clean package -Pdist -pl desktop-client/distribution -am -DskipTests "-Dapp.version=$VERSION")
          # Manual runs without the variable keep the default localhost URL
          if [ -n "$NETHELT_API_URL" ]; then
            args+=("-Dnethelt.api-url=$NETHELT_API_URL")
          fi
          mvn "${args[@]}"

      - name: Smoke test install (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          installer=desktop-client/distribution/src/unix/install.sh
          sudo "$installer" --yes --archive-dir desktop-client/distribution/target
          echo "ci-test-pat" | sudo nethelt auth register --stdin
          sudo nethelt auth status | grep "status: Registered"
          # Give the agent time to start, it cannot reach the API here, but must keep running
          sleep 20
          if [ "$RUNNER_OS" = "Linux" ]; then
            systemctl is-active nethelt-agent
            sudo journalctl -u nethelt-agent --no-pager -n 20
            sudo journalctl -u nethelt-agent --no-pager | grep "Started App"
          else
            sudo launchctl print system/pl.sgorski.nethelt.agent | grep "state = running"
            sudo tail -n 20 /Library/Logs/NetHelt/agent.log
            sudo grep "Started App" /Library/Logs/NetHelt/agent.log
          fi
          sudo nethelt uninstall --yes --purge
          test ! -e /opt/nethelt
          test ! -e /usr/local/bin/nethelt

      - name: Smoke test install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\Program Files\NetHelt'
          $config = 'C:\ProgramData\NetHelt'
          $setup = Get-ChildItem desktop-client/distribution/target/nethelt-setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', "/LOG=$PWD\setup.log" -Wait

          'ci-test-pat' | & "$app\nethelt.exe" auth register --stdin
          # -cmatch, because -match ignores case and would also match "Not registered"
          if (-not ((& "$app\nethelt.exe" auth status) -cmatch 'status: Registered')) { throw 'PAT was not registered' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -notlike "*$app*") { throw 'Install dir is not in PATH' }

          # Give the agent time to start, it cannot reach the API here, but must keep running
          Start-Sleep -Seconds 20
          $service = Get-Service nethelt-agent
          if ($service.Status -ne 'Running') { throw "Service nethelt-agent is $($service.Status)" }
          icacls $config
          Get-ChildItem "$config\logs" | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 20 }

          # Starts unins000.exe and returns, the uninstaller continues in a temporary copy of itself
          & "$app\nethelt.exe" uninstall --yes --purge
          if ($LASTEXITCODE -ne 0) { throw "nethelt uninstall failed with exit code $LASTEXITCODE" }
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\unins000.exe"); $i++) { Start-Sleep -Seconds 2 }
          # Files of the CLI that started the uninstaller must not stay locked
          if (Test-Path "$app\nethelt.exe") { throw "$app\nethelt.exe was not removed" }
          sc.exe query nethelt-agent | Out-Null
          if ($LASTEXITCODE -ne 1060) { throw 'Service nethelt-agent still exists' }
          if (Test-Path $config) { throw "/PURGE did not remove $config" }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -like "*$app*") { throw 'PATH entry was not removed' }
          exit 0

      - name: Upload installer logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs-${{ matrix.platform }}
          path: |
            setup.log
            uninstall.log
          if-no-files-found: ignore

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: desktop-client/distribution/target/${{ matrix.dist }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Add install script and checksums
        run: |
          cp desktop-client/distribution/src/unix/install.sh release/
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload test bundle
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: nethelt-desktop-client-${{ needs.prepare.outputs.version }}
          path: release/
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Desktop client $VERSION" \
            --generate-notes \
            --latest
